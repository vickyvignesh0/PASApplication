services:
  # PostgreSQL Database for Marten Document Store & Event Sourcing
  pas-db:
    image: postgres:16-alpine
    container_name: pas-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pasdb
    ports:
      - "5432:5432"
    volumes:
      - pas-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pasdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker for Event-Driven Communication (MassTransit)
  pas-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pas-rabbitmq
    ports:
      - "5672:5672"     # AMQP Protocol
      - "15672:15672"   # RabbitMQ Management Console
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Distributed Cache & Real-Time Waiting List Tracking
  pas-redis:
    image: redis:7-alpine
    container_name: pas-redis
    ports:
      - "6379:6379"     # Redis Port
    volumes:
      - pas-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pas-db-data:
  pas-redis-data:
